<title>Мои финансы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;600;700&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: single mobile-first column (max 760px) — the plan (bills, envelopes) is home; forms open in a bottom sheet.
   Look: one committed dark theme — charcoal ground, acid-lime hero cards and actions, violet goal panels, cyan details. */
:root {
  --bg: #16161b;
  --surface: #212128;
  --surface-2: #2b2b34;
  --fg: #f5f5f7;
  --muted: #9b9ba9;
  --line: #33333d;
  --track: #2b2b34;
  --accent: #c6f432;
  --on-accent: #15151a;
  --on-accent-muted: rgb(21 21 26 / 0.62);
  --violet: #6a3fd2;
  --violet-2: #7d55e0;
  --cyan: #63e3e8;
  --pos: #c6f432;
  --neg: #ff7b6e;
  --warn: #ffb648;
  --scrim: rgb(8 8 12 / 0.7);
  --shadow: 0 10px 30px rgb(0 0 0 / 0.25);
  --font-display: "Wix Madefor Display", "Wix Madefor Text", system-ui, sans-serif;
  --font-body: "Wix Madefor Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 26px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
input, select {
  width: 100%; min-height: 42px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.4; }
h1, h2, h3, h4, p { margin: 0; }
.app {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 110px;
}
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.warn { color: var(--warn); }

.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.topbar h1 { font: 600 26px/1.05 var(--font-display); letter-spacing: -0.02em; }
.chip { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.busy { color: var(--warn); }
.period { display: flex; align-items: center; gap: 4px; }
.period-label { min-width: 150px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; }
.icon-btn { width: 38px; height: 38px; flex: none; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 22px; line-height: 1; }
.icon-btn.sm { width: 32px; height: 32px; border-color: transparent; background: transparent; font-size: 16px; color: var(--muted); }
.icon-btn:not(:disabled):hover { background: var(--track); }

.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.tile.balance { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tile.balance .muted, .tile.balance b { color: var(--on-accent-muted); }
.tile.balance strong { font: 600 clamp(30px, 9vw, 40px)/1.1 var(--font-display); letter-spacing: -0.03em; overflow-wrap: anywhere; }
.tile strong { font: 600 20px/1.2 var(--font-display); overflow-wrap: anywhere; }

.tabs { display: flex; gap: 2px; margin-bottom: 18px; padding: 5px; overflow-x: auto; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); scrollbar-width: none; }
.tab { flex: 1 0 auto; padding: 9px 8px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

.segmented { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.segmented button { padding: 6px 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
.segmented button.active { background: var(--accent); color: var(--on-accent); }
.segmented.wide { display: flex; }
.segmented.wide button { flex: 1; padding-block: 8px; }

.filters { display: grid; gap: 8px; margin-bottom: 16px; }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }
.welcome { display: grid; gap: 12px; justify-items: center; padding: 28px 20px; border: 1px dashed var(--line); border-radius: var(--radius); text-align: center; }
.welcome h2 { font: 600 20px/1.25 var(--font-display); text-wrap: balance; }
.welcome p { max-width: 42ch; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; padding: 12px 16px; border-radius: 18px; background: var(--violet); font-size: 13px; }
.link-btn { padding: 0; border: none; background: none; color: var(--accent); font-weight: 600; }

.day { margin-bottom: 16px; }
.day-head { display: flex; justify-content: space-between; gap: 8px; padding: 0 4px 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
.tx-list { margin: 0; padding: 0; list-style: none; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tx-list li + li { border-top: 1px solid var(--line); }
.tx { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border: none; background: transparent; text-align: left; }
.tx:hover { background: var(--surface-2); }
.tx-main { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.tx-cat { font-weight: 500; }
.tx-note { overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.tx-amount { font-weight: 600; white-space: nowrap; }
.tx-amount.move { color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; flex: none; border-radius: 999px; }
.tag { margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--track); color: var(--muted); font-size: 11px; font-weight: 600; vertical-align: 1px; white-space: nowrap; }

.fab {
  position: fixed;
  right: calc(max(20px, calc(50% - 360px)) + env(safe-area-inset-right, 0px));
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; border: none; border-radius: 999px;
  background: var(--accent); color: var(--on-accent); font-size: 32px; line-height: 1;
  box-shadow: 0 10px 30px rgb(198 244 50 / 0.3), 0 0 0 6px var(--bg);
}

.overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet {
  display: grid; gap: 12px; width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto;
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  border-radius: 28px 28px 0 0; background: var(--surface);
}
@media (min-width: 640px) {
  .overlay { align-items: center; }
  .sheet { border-radius: 28px; }
}
.sheet h2 { font: 600 22px/1.2 var(--font-display); letter-spacing: -0.01em; }
.sheet label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
.sheet label input, .sheet label select { color: var(--fg); font-size: 15px; }
.form-body { display: grid; gap: 12px; }
.form-intro { color: var(--muted); font-size: 14px; }
.alloc-row { display: grid; grid-template-columns: 1fr 140px; align-items: center; gap: 10px; }
.alloc-row span { min-width: 0; color: var(--fg); font-size: 14px; }
.alloc-row input { text-align: right; }
.alloc-left { display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
#fAmount { font: 600 30px/1.1 var(--font-display); }
.error { color: var(--neg); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.spacer { flex: 1; }

.btn { min-height: 44px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); font-weight: 600; }
.btn.sm { min-height: 34px; padding: 4px 14px; font-size: 13px; }
.btn:not(:disabled):hover { background: var(--line); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.primary:not(:disabled):hover { background: var(--accent); filter: brightness(1.08); }
.btn.danger { color: var(--neg); }
.btn.danger-fill { border-color: var(--neg); background: var(--neg); color: var(--on-accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.card { margin-bottom: 16px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.card h3 { margin-bottom: 12px; font: 600 18px/1.25 var(--font-display); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.card-head h3 { margin: 0; }
.card-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 12px; }

/* Plan */
.card.plan-hero { display: grid; gap: 14px; border: none; background: var(--accent); color: var(--on-accent); }
.plan-hero .muted { color: var(--on-accent-muted); }
.plan-hero .big { font: 600 clamp(38px, 12vw, 52px)/1 var(--font-display); letter-spacing: -0.04em; overflow-wrap: anywhere; }
.plan-hero .big.neg { color: #b3261e; }
.plan-hero .verdict, .plan-hero .verdict.good { background: rgb(21 21 26 / 0.08); color: var(--on-accent); }
.plan-hero .verdict.bad { background: var(--on-accent); color: var(--neg); }
.kv { display: grid; gap: 6px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; }
.kv div span:last-child { font-weight: 600; text-align: right; white-space: nowrap; }
.verdict { padding: 12px 14px; border-radius: 16px; background: var(--surface-2); font-size: 14px; }
.verdict.bad { color: var(--neg); }
.verdict.good { color: var(--pos); }
.bill-list, .env-list, .proj-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.bill { display: grid; grid-template-columns: 52px 1fr; align-items: start; gap: 6px 12px; padding: 12px 0; }
.bill + .bill, .env + .env, .proj + .proj { border-top: 1px solid var(--line); }
.due { display: grid; justify-items: center; padding: 7px 0; border-radius: 16px; background: rgb(99 227 232 / 0.12); line-height: 1.1; }
.due b { color: var(--cyan); font: 600 19px/1.1 var(--font-display); }
.due span { color: var(--muted); font-size: 11px; }
.bill-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bill-top { display: flex; justify-content: space-between; gap: 12px; }
.bill-name { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.bill-amt { font-weight: 600; white-space: nowrap; }
.bill-side { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px; grid-column: 2; }
.status { font-size: 12px; font-weight: 600; }
.bill.paid .bill-name, .bill.paid .bill-amt { color: var(--muted); }
.bill.paid .due { opacity: 0.5; }
.card.envs { border: none; background: var(--violet); }
.envs .muted, .envs .env-meta .muted { color: rgb(255 255 255 / 0.7); }
.envs .link-btn { color: var(--accent); }
.envs .tag { background: rgb(0 0 0 / 0.22); color: #fff; }
.envs .btn { border-color: transparent; background: rgb(255 255 255 / 0.14); }
.envs .env-list { gap: 10px; }
.env { display: grid; gap: 8px; padding: 14px 16px; border-radius: 20px; background: var(--violet-2); }
.envs .env + .env { border-top: none; }
.envs .progress { background: repeating-linear-gradient(-45deg, rgb(0 0 0 / 0.28) 0 6px, rgb(0 0 0 / 0.16) 6px 12px); }
.env-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.env-name { font-weight: 600; overflow-wrap: anywhere; }
.env-bal { font: 600 18px/1.2 var(--font-display); white-space: nowrap; }
.env-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
.params { display: grid; gap: 10px; }
.sheet label.check { display: flex; align-items: center; gap: 10px; color: var(--fg); font-size: 14px; }
.sheet label.check input { width: 20px; min-height: 20px; height: 20px; flex: none; }
.params label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
@media (min-width: 560px) { .params { grid-template-columns: repeat(3, 1fr); } }
.proj { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; }
.proj-name { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.proj-sum { font-weight: 600; text-align: right; white-space: nowrap; }

.donut-wrap { display: grid; gap: 20px; align-items: center; }
@media (min-width: 560px) { .donut-wrap { grid-template-columns: 200px 1fr; } }
.donut { position: relative; width: 200px; max-width: 100%; margin: 0 auto; }
.donut svg { display: block; width: 100%; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
.donut-center strong { font-size: 15px; overflow-wrap: anywhere; }
.legend { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: auto 1fr auto 40px; align-items: center; gap: 8px; }
.legend-name { min-width: 0; overflow-wrap: anywhere; }
.legend-value { font-weight: 600; white-space: nowrap; }
.legend-pct { text-align: right; }
.chart-legend { display: flex; gap: 12px; color: var(--muted); }
.swatch { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 3px; }
.inc { background: var(--pos); }
.exp { background: var(--neg); }
.bars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.bar-pair { display: flex; align-items: flex-end; justify-content: center; gap: 3px; width: 100%; height: 140px; border-bottom: 1px solid var(--line); }
.bar { width: 40%; max-width: 18px; border-radius: 4px 4px 0 0; }
.bar-label { color: var(--muted); font-size: 12px; }
.bar-net { font-size: 11px; font-weight: 600; white-space: nowrap; }

.hint { margin: 0 4px 12px; }
.budget-list { margin: 0; padding: 0; list-style: none; }
.budget-row { margin-bottom: 8px; padding: 12px 16px; }
.budget-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.budget-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500; }
.budget-input { width: 130px; min-height: 36px; flex: none; text-align: right; }
.budget-input.invalid { border-color: var(--neg); }
.budget-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 6px; }
.progress { height: 10px; margin-top: 10px; overflow: hidden; border-radius: 999px; background: repeating-linear-gradient(-45deg, var(--surface-2) 0 6px, var(--line) 6px 12px); }
.env .progress { margin-top: 0; }
.progress-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }
.progress-fill.ok { background: var(--pos); }
.progress-fill.warn { background: var(--warn); }
.progress-fill.over { background: var(--neg); }
.progress-fill.goal { background: var(--accent); }

.cat-group { margin-bottom: 12px; }
.cat-group h4 { margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.cat-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.cat-row { display: flex; align-items: center; gap: 8px; }
.cat-row input[type="color"] { width: 38px; height: 38px; min-height: 38px; flex: none; padding: 2px; }
.cat-row .cat-name { min-height: 38px; }
.cat-used { min-width: 24px; text-align: right; }
.add-cat { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
.add-cat input { grid-column: 1 / -1; }
@media (min-width: 560px) {
  .add-cat { grid-template-columns: 1fr 130px auto; }
  .add-cat input { grid-column: auto; }
}
#currency { width: 100px; }

.dialog { display: grid; gap: 14px; width: min(400px, calc(100% - 32px)); margin: auto; padding: 22px; border: 1px solid var(--line); border-radius: 26px; background: var(--surface); }
.dialog-wrap { align-items: center; z-index: 25; }
.quick { display: grid; gap: 6px; margin-bottom: 16px; }
.quick-row { display: flex; gap: 8px; }
.quick-row input { min-height: 48px; border-radius: 999px; padding-inline: 18px; background: var(--surface); }
.quick-row button { width: 48px; height: 48px; flex: none; border: none; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 20px; font-weight: 700; }
.quick-hint { min-height: 18px; padding-inline: 18px; color: var(--muted); font-size: 12px; }
.recon { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.recon .btn { border-color: transparent; background: var(--on-accent); color: var(--accent); }
.toast-action { margin-left: 12px; padding: 4px 12px; border: none; border-radius: 999px; background: var(--on-accent); color: var(--accent); font-weight: 600; }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; transform: translateX(-50%);
  background: var(--fg); color: var(--on-accent); font-size: 14px; font-weight: 500; box-shadow: var(--shadow);
}

@media (min-width: 640px) {
  .summary { grid-template-columns: 2fr 1fr 1fr; }
  .tile.balance { grid-column: auto; }
  .filters { grid-template-columns: auto 200px 1fr; align-items: center; }
}
@media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Мои финансы</h1>
      <span id="sync" class="chip">Загрузка…</span>
    </div>
    <div class="period" id="periodBox">
      <button class="icon-btn" id="prevMonth" data-action="month" data-delta="-1" aria-label="Предыдущий месяц">‹</button>
      <button class="period-label" id="periodLabel" data-action="toggle-all" title="Переключить: месяц / всё время"></button>
      <button class="icon-btn" id="nextMonth" data-action="month" data-delta="1" aria-label="Следующий месяц">›</button>
    </div>
  </header>

  <form class="quick" id="quick" autocomplete="off">
    <div class="quick-row">
      <input id="quickInput" placeholder="такси 2500 · магнум 18к" aria-label="Быстрая запись операции">
      <button type="submit" aria-label="Записать">→</button>
    </div>
    <div class="quick-hint" id="quickHint">Сумма и пара слов. Знак «+» в начале — это доход.</div>
  </form>

  <section id="summary" class="summary" aria-live="polite"></section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-plan" data-action="tab" data-tab="plan" aria-selected="true">План</button>
    <button class="tab" role="tab" id="tab-ops" data-action="tab" data-tab="ops" aria-selected="false">Операции</button>
    <button class="tab" role="tab" id="tab-stats" data-action="tab" data-tab="stats" aria-selected="false">Анализ</button>
    <button class="tab" role="tab" id="tab-budgets" data-action="tab" data-tab="budgets" aria-selected="false">Бюджеты</button>
    <button class="tab" role="tab" id="tab-settings" data-action="tab" data-tab="settings" aria-selected="false">Ещё</button>
  </nav>

  <main>
    <section id="view-plan"></section>
    <section id="view-ops" hidden>
      <div class="filters">
        <div class="segmented" id="fKind">
          <button data-action="fkind" data-kind="all" class="active">Все</button>
          <button data-action="fkind" data-kind="expense">Расходы</button>
          <button data-action="fkind" data-kind="income">Доходы</button>
        </div>
        <select id="fCat" aria-label="Категория"></select>
        <input id="fQuery" type="search" placeholder="Поиск по комментарию, проекту, категории">
      </div>
      <div id="txList"></div>
    </section>
    <section id="view-stats" hidden></section>
    <section id="view-budgets" hidden></section>
    <section id="view-settings" hidden></section>
  </main>

  <button class="fab" id="fab" data-action="new-tx" aria-label="Добавить операцию">+</button>
</div>

<div class="overlay" id="sheet" hidden>
  <form class="sheet" id="txForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <h2 id="sheetTitle">Новая операция</h2>
    <div class="segmented wide" id="sKind">
      <button type="button" data-action="sheet-kind" data-kind="expense">Расход</button>
      <button type="button" data-action="sheet-kind" data-kind="income">Доход</button>
    </div>
    <label>Сумма, <span id="sCurrency">₸</span>
      <input id="fAmount" inputmode="decimal" placeholder="0" autocomplete="off">
    </label>

<script>
"use strict";
// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const currentMonth = () => todayISO().slice(0, 7);
function shiftMonth(month, delta) {
  const [y, m] = month.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
const toDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
const MONTHS = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
const MONTHS_SHORT = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const WEEKDAYS = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const monthLabel = (m) => `${MONTHS[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`;
const shortDate = (d) => `${Number(d.slice(8, 10))} ${MONTHS_SHORT[Number(d.slice(5, 7)) - 1]}`;
function dayLabel(date) {
  const today = todayISO();
  if (date === today) return "Сегодня";
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (date === iso(y)) return "Вчера";
  const [yy, mm, dd] = date.split("-").map(Number);
  const wd = WEEKDAYS[new Date(yy, mm - 1, dd).getDay()];
  return `${dd} ${MONTHS_GEN[mm - 1]}${String(yy) === today.slice(0, 4) ? "" : " " + yy}, ${wd}`;
}
function ago(d) { const n = daysBetween(d, todayISO()); return n <= 0 ? "сегодня" : n === 1 ? "вчера" : `${n} ${plural(n, "день", "дня", "дней")} назад`; }
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many;
}
const nf = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });
const cf = new Intl.NumberFormat("ru-RU", { notation: "compact", maximumFractionDigits: 1 });
const money = (n) => `${nf.format(n)} ${app.profile.currency}`;
const signed = (n) => (n > 0 ? "+" : "") + money(n);
function parseAmount(input) {
  const s = String(input).replace(/[\s ]/g, "").replace(",", ".");
  return /^\d+(\.\d{0,2})?$/.test(s) ? Number(s) : NaN;
}
const sumBy = (list, kind) => list.reduce((a, t) => (t.kind === kind ? a + t.amount : a), 0);
const num = (v, d = 0) => (typeof v === "number" && Number.isFinite(v) && v >= 0 ? v : d);

// ---------- data model ----------
const PALETTE = ["#0f766e", "#2563eb", "#d97706", "#dc2626", "#7c3aed", "#db2777", "#059669", "#0891b2", "#65a30d", "#ea580c", "#64748b"];
const DEFAULT_CATEGORIES = [
  ["Продукты", "expense"], ["Кафе и рестораны", "expense"], ["Транспорт", "expense"], ["Жильё и коммуналка", "expense"],
  ["Кредиты", "expense"], ["Детский сад", "expense"], ["Семья", "expense"],
  ["Связь и интернет", "expense"], ["Здоровье", "expense"], ["Одежда", "expense"], ["Развлечения", "expense"],
  ["Подписки", "expense"], ["Другое", "expense"],
  ["Проекты", "income"], ["Подарки", "income"], ["Другое", "income"],
];
const DEFAULT_ENVELOPES = [
  ["Резерв на непредвиденное", 10], ["Подушка безопасности", 40], ["Квартира", 30], ["Путешествия", 20],
];
const defaultProfile = () => ({
  version: 1, currency: "₸", budgets: {},
  categories: DEFAULT_CATEGORIES.map(([name, kind], i) => ({ id: uid(), name, kind, color: PALETTE[i % PALETTE.length] })),
  bills: [],
  envelopes: DEFAULT_ENVELOPES.map(([name, share]) => ({ id: uid(), name, target: 0, share, opening: 0, monthly: 0, deadline: "", liquid: true })),
  living: 0, bufferMonths: 1, openingFree: 0, marked: {}, lastRecon: "",
});
const isKind = (v) => v === "income" || v === "expense";
const isId = (v) => typeof v === "string" && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(v);
function parseProfile(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.categories)) return null;
  const categories = raw.categories.filter((c) => c && isId(c.id) && typeof c.name === "string" && isKind(c.kind) && typeof c.color === "string")
    .map((c) => ({ id: c.id, name: c.name, kind: c.kind, color: c.color }));
  const ids = new Set(categories.map((c) => c.id));
  const budgets = {};
  for (const [id, v] of Object.entries(raw.budgets && typeof raw.budgets === "object" ? raw.budgets : {})) {
    if (ids.has(id) && typeof v === "number" && v > 0) budgets[id] = v;
  }
  const bills = (Array.isArray(raw.bills) ? raw.bills : [])
    .filter((b) => b && isId(b.id) && typeof b.name === "string" && num(b.amount) > 0 && Number.isInteger(b.day) && b.day >= 1 && b.day <= 31)
    .map((b) => ({ id: b.id, name: b.name, amount: b.amount, day: b.day, categoryId: typeof b.categoryId === "string" ? b.categoryId : "" }));
  const envelopes = (Array.isArray(raw.envelopes) ? raw.envelopes : [])
    .filter((e) => e && isId(e.id) && typeof e.name === "string")
    .map((e) => ({
      id: e.id, name: e.name, target: num(e.target), share: Math.min(100, num(e.share)), opening: num(e.opening),
      monthly: num(e.monthly), deadline: typeof e.deadline === "string" && /^\d{4}-\d{2}$/.test(e.deadline) ? e.deadline : "", liquid: e.liquid !== false,
    }));
  const currency = typeof raw.currency === "string" && raw.currency.trim() ? raw.currency.slice(0, 4) : "₸";
  const marked = {};
  for (const [m, list] of Object.entries(raw.marked && typeof raw.marked === "object" ? raw.marked : {})) {
    if (/^\d{4}-\d{2}$/.test(m) && Array.isArray(list)) marked[m] = list.filter((x) => typeof x === "string");
  }
  return {
    version: 1, currency, budgets, categories, bills, envelopes,
    living: num(raw.living), bufferMonths: Math.min(12, num(raw.bufferMonths, 1)), openingFree: num(raw.openingFree), marked,
    lastRecon: typeof raw.lastRecon === "string" && /^\d{4}-\d{2}-\d{2}$/.test(raw.lastRecon) ? raw.lastRecon : "",
  };
}
function parseTx(raw, id) {
  if (!raw || typeof raw !== "object") return null;
  const tx = {
    id: String(id ?? raw.id ?? ""),
    kind: raw.kind, amount: raw.amount, date: raw.date,
    categoryId: typeof raw.categoryId === "string" ? raw.categoryId : "",
    note: typeof raw.note === "string" ? raw.note : "",
    createdAt: Number(raw.createdAt) || 0,
  };
  for (const k of ["project", "billId", "envelopeId", "sourceTxId"]) if (typeof raw[k] === "string" && raw[k]) tx[k] = raw[k];
  if (raw.sample === true) tx.sample = true;
  if (raw.recon === true) tx.recon = true;
  if (raw.kind === "transfer") {
    tx.from = typeof raw.from === "string" ? raw.from : "";
    tx.to = typeof raw.to === "string" ? raw.to : "";
    if (tx.from === tx.to) return null;
  }
  const ok = isId(tx.id) && (isKind(tx.kind) || tx.kind === "transfer") && typeof tx.amount === "number" && Number.isFinite(tx.amount) &&
    tx.amount > 0 && /^\d{4}-\d{2}-\d{2}$/.test(tx.date) && (tx.kind === "transfer" || tx.categoryId);
  return ok ? tx : null;
}
const txBody = (tx) => { const { id, ...body } = tx; return body; };

const app = { profile: defaultProfile(), profileSaved: false, txs: [], backend: "loading", ready: false, pending: 0 };
const ui = { tab: "plan", period: currentMonth(), fKind: "all", fCat: "", query: "", statsKind: "expense", editing: null, sheetKind: "expense", sheetBillId: "" };
const catMap = () => new Map(app.profile.categories.map((c) => [c.id, c]));
const inPeriod = (t) => ui.period === "all" || t.date.startsWith(ui.period);
const flows = () => app.txs.filter((t) => t.kind !== "transfer");

// ---------- money math: free money vs envelopes ----------
function envBalances() {
  const m = new Map(app.profile.envelopes.map((e) => [e.id, e.opening]));
  for (const t of app.txs) {
    if (t.kind === "transfer") {
      if (m.has(t.to)) m.set(t.to, m.get(t.to) + t.amount);
      if (m.has(t.from)) m.set(t.from, m.get(t.from) - t.amount);
    } else if (t.kind === "expense" && t.envelopeId && m.has(t.envelopeId)) {
      m.set(t.envelopeId, m.get(t.envelopeId) - t.amount);
    }
  }
  return m;
}
function totalBalance() {
  const p = app.profile;
  return p.openingFree + p.envelopes.reduce((a, e) => a + e.opening, 0) + sumBy(app.txs, "income") - sumBy(app.txs, "expense");
}
function freeMoney() {
  let s = totalBalance();
  for (const v of envBalances().values()) s -= v;
  return s;
}
const envName = (id) => (id ? app.profile.envelopes.find((e) => e.id === id)?.name || "Удалённый конверт" : "Свободные");
const billsTotal = () => app.profile.bills.reduce((a, b) => a + b.amount, 0);
const monthlyMinimum = () => billsTotal() + app.profile.living;
function billDue(b, month) {
  const [y, m] = month.split("-").map(Number);
  return `${month}-${pad(Math.min(b.day, new Date(y, m, 0).getDate()))}`;
}
/** A bill counts as paid by a recorded payment, or by a mark for money that left before tracking started. */
const billPayment = (b, month) => app.txs.find((t) => t.kind === "expense" && t.billId === b.id && t.date.startsWith(month)) ||
  ((app.profile.marked[month] || []).includes(b.id) ? { marked: true } : null);
function unpaidBills(month) {
  return app.profile.bills.filter((b) => !billPayment(b, month)).map((b) => ({ b, due: billDue(b, month) })).sort((x, y) => x.due.localeCompare(y.due));
}
const deadlineLabel = (d) => `до конца ${MONTHS_GEN[Number(d.slice(5, 7)) - 1]} ${d.slice(0, 4)}`;
function monthsLeft(deadline) {
  const [y, m] = deadline.split("-").map(Number), [cy, cm] = currentMonth().split("-").map(Number);
  return (y - cy) * 12 + (m - cm) + 1;
}
const paidInThisMonth = (envId) => app.txs.reduce((a, t) => (t.kind === "transfer" && t.to === envId && t.date.startsWith(currentMonth()) ? a + t.amount : a), 0);
/** This month's contribution plan for an envelope: a deadline goal spreads what is missing over the months left; otherwise a fixed monthly sum. */
function envQuota(e, balance) {
  const done = paidInThisMonth(e.id);
  let need = 0, months = 0;
  if (e.target > 0 && e.deadline) {
    months = monthsLeft(e.deadline);
    const missing = Math.max(0, e.target - (balance - done));
    need = months > 0 ? Math.ceil(missing / months / 1000) * 1000 : missing;
  } else if (e.monthly > 0) need = e.monthly;
  return { need, done, left: Math.max(0, need - done), months };
}
/** Income suggestion: keep free money up to the buffer, then this month's envelope plans in list order, then shares of what is left. */
function suggestAllocation(amount) {
  const p = app.profile, bal = envBalances();
  const freeBefore = freeMoney() - amount;
  const unpaidNow = unpaidBills(currentMonth()).reduce((a, x) => a + x.b.amount, 0);
  const bufferTarget = unpaidNow + p.bufferMonths * monthlyMinimum();
  const keep = Math.min(amount, Math.max(0, bufferTarget - freeBefore));
  let rest = amount - keep;
  const room = (e, given) => (e.target > 0 ? Math.max(0, Math.floor(e.target - bal.get(e.id) - given)) : Infinity);
  const parts = p.envelopes.map((e) => {
    const give = Math.min(rest, envQuota(e, bal.get(e.id)).left, room(e, 0));
    rest -= give;
    return { e, give };
  });
  const pool = rest;
  for (const part of parts) {
    const extra = Math.min(Math.floor((pool * part.e.share) / 100), room(part.e, part.give));
    part.give += extra;
  }
  return { keep, bufferTarget, freeBefore, parts };
}

// ---------- storage: private per-person store in the account, browser as a fallback ----------
const LOCAL_KEY = "finance-tracker:v1";
let db = null, profileRef = null, txCol = null, writeChain = Promise.resolve();

function loadLocal() {
  try {
    const raw = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
    const p = raw && parseProfile(raw.profile);
    if (p) { app.profile = p; app.profileSaved = true; }
    app.txs = raw && Array.isArray(raw.txs) ? raw.txs.map((t) => parseTx(t)).filter(Boolean) : [];
  } catch { app.txs = []; }
}
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ profile: app.profile, txs: app.txs })); } catch { /* storage blocked: keep in memory */ }
}
function writeError(e) {
  const code = e && e.code;
  if (code === "quota_exceeded") toast("Хранилище заполнено. Удали старые операции, чтобы добавить новые.");
  else if (code === "invalid_argument") toast("Не получилось сохранить: у этого аккаунта нет прав на запись.");
  else toast("Не получилось сохранить. Проверь соединение и повтори.");
}
function queue(fn) {
  app.pending++; renderSync();
  writeChain = writeChain.then(fn).catch(writeError).finally(() => { app.pending--; renderSync(); });
  return writeChain;
}
async function inBatches(list, fn, size = 8) {
  for (let i = 0; i < list.length; i += size) await Promise.all(list.slice(i, i + size).map(fn));
}
function persistProfile() {
  app.profileSaved = true;
  if (app.backend === "cloud") {
    const body = JSON.parse(JSON.stringify(app.profile));
    queue(() => profileRef.set(body));
  } else saveLocal();
}
function upsertTxs(list) {
  for (const tx of list) {
    const i = app.txs.findIndex((t) => t.id === tx.id);
    if (i >= 0) app.txs[i] = tx; else app.txs.push(tx);
  }
  if (app.backend === "cloud") {
    if (!app.profileSaved) persistProfile();
    queue(() => inBatches(list, (tx) => txCol.doc(tx.id).set(txBody(tx))));
  } else { app.profileSaved = true; saveLocal(); }
  renderAll();
}
const upsertTx = (tx) => upsertTxs([tx]);
function removeTxs(ids) {
  const set = new Set(ids);
  app.txs = app.txs.filter((t) => !set.has(t.id));
  if (app.backend === "cloud") queue(() => inBatches([...set], (id) => txCol.doc(id).delete()));
  else saveLocal();
  renderAll();
}
function updateProfile(mutate) {
  mutate(app.profile);
  persistProfile();
  renderAll();
}
function replaceAll(profile, txs) {
  const keep = new Set(txs.map((t) => t.id));
  const stale = app.txs.filter((t) => !keep.has(t.id)).map((t) => t.id);
  app.profile = profile; app.txs = txs;
  if (app.backend === "cloud") {
    persistProfile();
    queue(async () => {
      await inBatches(stale, (id) => txCol.doc(id).delete());
      await inBatches(txs, (t) => txCol.doc(t.id).set(txBody(t)));
    });
  } else { app.profileSaved = true; saveLocal(); }
  renderAll();
}

async function init() {
  renderAll();
  let user = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    }
  } catch { db = null; }
  const id = db && user ? await user.id().catch(() => null) : null;
  if (!db || !id) {
    app.backend = "local"; loadLocal(); app.ready = true; renderAll();
    return;
  }
  app.backend = "cloud";
  profileRef = db.doc(`data/users/${id}/profile`);
  txCol = profileRef.collection("tx");
  let gotProfile = false, gotTxs = false;
  const lost = () => toast("Связь с хранилищем прервалась. Обнови страницу.");
  profileRef.onSnapshot((snap) => {
    const p = snap.exists ? parseProfile(snap.data()) : null;
    if (p) { app.profile = p; app.profileSaved = true; }
    else if (app.profileSaved) { app.profile = defaultProfile(); app.profileSaved = false; }
    gotProfile = true; app.ready = gotProfile && gotTxs; renderAll();
  }, lost);
  txCol.onSnapshot((snap) => {
    app.txs = snap.docs.map((d) => parseTx(d.data(), d.id)).filter(Boolean);
    gotTxs = true; app.ready = gotProfile && gotTxs; renderAll();
  }, lost);
}

// ---------- rendering ----------
// A view is not redrawn while someone is typing in it; it catches up on focus loss.
const deferred = new Set();
function canRender(el, name) {
  const a = document.activeElement;
  if (a && el.contains(a) && /^(INPUT|SELECT)$/.test(a.tagName)) { deferred.add(name); return false; }
  deferred.delete(name); return true;
}
document.addEventListener("focusout", () => setTimeout(() => { if (deferred.size) renderAll(); }, 0));

function renderAll() {
  renderSync(); renderHeader(); renderSummary();
  for (const t of ["plan", "ops", "stats", "budgets", "settings"]) {
    $(`#view-${t}`).hidden = ui.tab !== t;
    $(`#tab-${t}`).setAttribute("aria-selected", String(ui.tab === t));
  }
  ({ plan: renderPlan, ops: renderOps, stats: renderStats, budgets: renderBudgets, settings: renderSettings })[ui.tab]();
}
function renderSync() {
  const el = $("#sync");
  el.classList.toggle("busy", app.pending > 0);
  el.textContent = app.backend === "loading" ? "Загрузка…" : app.pending > 0 ? "Сохраняю…" : app.backend === "cloud" ? "Сохранено в аккаунте" : "Только в этом браузере";
}
function renderHeader() {
  const all = ui.period === "all";
  // The plan always works on the real current month, so the month switcher is hidden there.
  $("#periodBox").hidden = ui.tab === "plan" || ui.tab === "settings";
  $("#periodLabel").textContent = all ? "Всё время" : monthLabel(ui.period);
  $("#prevMonth").disabled = all; $("#nextMonth").disabled = all;
}
function renderSummary() {
  const box = $("#summary");
  if (ui.tab === "plan" || ui.tab === "settings") { box.hidden = true; return; }
  box.hidden = false;
  const list = flows().filter(inPeriod);
  const inc = sumBy(list, "income"), exp = sumBy(list, "expense");
  const net = inc - exp;
  box.innerHTML = `
    <div class="tile balance"><span class="muted">Все деньги</span><strong>${esc(money(totalBalance()))}</strong>
      ${ui.period !== "all" ? `<span class="small">За месяц: <b>${esc(signed(net))}</b></span>` : ""}</div>
    <div class="tile"><span class="muted">Доходы</span><strong class="pos">${esc(money(inc))}</strong></div>
    <div class="tile"><span class="muted">Расходы</span><strong class="neg">${esc(money(exp))}</strong></div>`;
}

function renderPlan() {
  const el = $("#view-plan");
  if (!canRender(el, "plan")) return;
  if (!app.ready) { el.innerHTML = `<p class="empty">Загружаю твой план…</p>`; return; }
  const p = app.profile, month = currentMonth(), today = todayISO();
  const free = freeMoney(), total = totalBalance(), bal = envBalances();
  const unpaid = unpaidBills(month);
  const unpaidSum = unpaid.reduce((a, x) => a + x.b.amount, 0);
  const after = free - unpaidSum;
  const minimum = monthlyMinimum();
  const liquid = free + p.envelopes.reduce((a, e) => a + (e.liquid ? Math.max(0, bal.get(e.id)) : 0), 0);
  const runway = minimum > 0 ? liquid / minimum : 0;

  // 1. Hero: can I cover this month?
  let verdict;
  if (!p.bills.length) verdict = `<div class="verdict">Добавь обязательные платежи ниже, и здесь появится ответ, хватает ли денег до конца месяца.</div>`;
  else if (!unpaid.length) verdict = `<div class="verdict good">Все обязательные платежи за ${MONTHS[Number(month.slice(5)) - 1].toLowerCase()} оплачены.</div>`;
  else if (after >= 0) verdict = `<div class="verdict good">Свободных денег хватает на все оставшиеся платежи месяца. После них останется ${esc(money(after))}.</div>`;
  else {
    // Only suggest envelopes marked as usable in an emergency that actually hold money.
    const spare = p.envelopes.filter((e) => e.liquid && bal.get(e.id) > 0).sort((x, y) => bal.get(y.id) - bal.get(x.id))[0];
    verdict = `<div class="verdict bad">До конца месяца не хватает ${esc(money(-after))} на обязательные платежи. ${spare
      ? `Пока доход не пришёл, можно взять из конверта «${esc(spare.name)}» (там ${esc(money(bal.get(spare.id)))}) или сократить необязательные траты.`
      : "Нужно дождаться дохода или сократить необязательные траты."}</div>`;
  }
  let html = `<div class="card plan-hero">
    <div><span class="muted small">Свободные деньги</span><div class="big ${free < 0 ? "neg" : ""}">${esc(money(free))}</div></div>
    <div class="kv small">
      <div><span class="muted">Осталось оплатить в этом месяце</span><span>${esc(money(unpaidSum))}</span></div>
      <div><span class="muted">Отложено в конвертах</span><span>${esc(money(total - free))}</span></div>
      ${minimum > 0 ? `<div><span class="muted">Доступных денег хватит</span><span>${runway < 0.1 ? "меньше чем на месяц" : `≈ ${nf.format(Math.round(runway * 10) / 10)} мес.`}</span></div>` : ""}
    </div>${verdict}
    <div class="recon small"><span class="muted">${p.lastRecon ? `Сверка баланса: ${esc(ago(p.lastRecon))}` : "Сверь баланс с картой Kaspi, чтобы не записывать мелкие траты"}</span>
      <button class="btn sm" data-action="recon">Сверить баланс</button></div></div>`;

  // 2. Bills calendar
  let running = 0;
  const unpaidIds = new Set(unpaid.map((x) => x.b.id));
  const rows = p.bills.map((b) => ({ b, due: billDue(b, month) })).sort((x, y) => x.due.localeCompare(y.due) || x.b.name.localeCompare(y.b.name)).map(({ b, due }) => {
    const paidTx = billPayment(b, month);
    let status;
    if (paidTx) status = `<span class="status pos">${paidTx.marked ? "Отмечено оплаченным" : "Оплачено " + esc(shortDate(paidTx.date))}</span>`;
    else {
      running += b.amount;
      const left = daysBetween(today, due);
      const when = left < 0 ? `<span class="status neg">Просрочено на ${-left} ${plural(-left, "день", "дня", "дней")}</span>`
        : left === 0 ? `<span class="status warn">Сегодня</span>` : `<span class="status muted">Через ${left} ${plural(left, "день", "дня", "дней")}</span>`;
      const cover = running <= free ? `<span class="status muted"> · хватает</span>` : `<span class="status neg"> · не хватает ${esc(money(Math.min(b.amount, running - Math.max(free, 0))))}</span>`;
      status = when + cover;
    }
    return `<li class="bill ${paidTx ? "paid" : ""}">
      <div class="due"><b>${Number(due.slice(8))}</b><span>${MONTHS_SHORT[Number(due.slice(5, 7)) - 1]}</span></div>
      <div class="bill-main"><div class="bill-top"><span class="bill-name">${esc(b.name)}</span><span class="bill-amt">${esc(money(b.amount))}</span></div>
        <span class="small">${status}</span></div>
      <div class="bill-side">
        ${unpaidIds.has(b.id) ? `<button class="link-btn small" data-action="mark-bill" data-id="${esc(b.id)}">Уже оплачен</button>
          <button class="btn sm primary" data-action="pay-bill" data-id="${esc(b.id)}">Оплатить</button>` : ""}
        ${paidTx && paidTx.marked ? `<button class="link-btn small" data-action="unmark-bill" data-id="${esc(b.id)}">Снять отметку</button>` : ""}
        <button class="icon-btn sm" data-action="edit-bill" data-id="${esc(b.id)}" aria-label="Изменить платёж ${esc(b.name)}">✎</button></div></li>`;
  }).join("");
  html += `<div class="card"><div class="card-head"><h3>Обязательные · ${esc(monthLabel(month))}</h3><span class="muted small">${esc(money(billsTotal()))} в месяц</span></div>
    ${p.bills.length ? `<ul class="bill-list">${rows}</ul>` : `<p class="muted small">Аренда, садик, кредиты, всё, что нужно платить каждый месяц.</p>`}
    <div class="card-foot"><button class="btn sm" data-action="new-bill">+ Добавить платёж</button>
      ${p.bills.length ? `<span class="muted small">Оплачено ${esc(money(billsTotal() - unpaidSum))} из ${esc(money(billsTotal()))}</span>` : ""}</div></div>`;

  // 3. Envelopes
  const shareSum = p.envelopes.reduce((a, e) => a + e.share, 0);
  const quotas = new Map(p.envelopes.map((e) => [e.id, envQuota(e, bal.get(e.id))]));
  const needAll = [...quotas.values()].reduce((a, q) => a + q.need, 0), doneAll = [...quotas.values()].reduce((a, q) => a + Math.min(q.done, q.need), 0);
  html += `<div class="card envs"><div class="card-head"><h3>Конверты</h3>${needAll ? `<span class="muted small">План на ${MONTHS[Number(month.slice(5)) - 1].toLowerCase()}: ${esc(money(doneAll))} из ${esc(money(needAll))}</span>` : ""}</div>
    ${p.envelopes.length ? `<ul class="env-list">` + p.envelopes.map((e) => {
      const b = bal.get(e.id), ratio = e.target > 0 ? Math.max(0, b) / e.target : 0, q = quotas.get(e.id);
      const goal = e.target > 0 ? `Цель ${esc(money(e.target))}${e.deadline ? " " + deadlineLabel(e.deadline) : ""} · ${Math.round(ratio * 100)}%` : "Без цели";
      const plan = !q.need ? (b >= e.target && e.target > 0 ? `<span class="pos">Цель достигнута</span>` : "")
        : q.left === 0 ? `<span class="pos">В этом месяце внесено ${esc(money(q.done))}, план выполнен</span>`
        : `<span>${e.deadline ? `Нужно ≈ ${esc(money(q.need))} в месяц` : `План ${esc(money(q.need))} в месяц`} · внесено ${esc(money(q.done))}, осталось ${esc(money(q.left))}</span>`;
      return `<li class="env"><div class="env-head"><span class="env-name">${esc(e.name)}${e.liquid ? "" : `<span class="tag">не трогать</span>`}</span><span class="env-bal">${esc(money(b))}</span></div>
        ${e.target > 0 ? `<div class="progress"><div class="progress-fill goal" style="width:${Math.min(ratio, 1) * 100}%"></div></div>` : ""}
        ${plan ? `<div class="small">${plan}</div>` : ""}
        <div class="env-meta small"><span class="muted">${goal}${e.share ? ` · ${e.share}% излишка` : ""}</span>
          <span class="btn-row"><button class="link-btn" data-action="env-in" data-id="${esc(e.id)}">Пополнить</button>
          <button class="link-btn" data-action="env-out" data-id="${esc(e.id)}">Взять</button>
          <button class="link-btn" data-action="edit-env" data-id="${esc(e.id)}">Изменить</button></span></div></li>`;
    }).join("") + `</ul>` : `<p class="muted small">Конверты держат деньги на цели отдельно от свободных.</p>`}
    <p class="muted small" style="margin-top:8px">Доход раскладывается так: сначала буфер свободных денег, затем план месяца по конвертам сверху вниз, затем остаток в процентах (сейчас ${shareSum}%).</p>
    ${shareSum > 100 ? `<p class="small neg" style="margin-top:8px">Сумма долей больше 100%. Уменьши доли, чтобы распределение сходилось.</p>` : ""}
    <div class="card-foot"><button class="btn sm" data-action="new-env">+ Новый конверт</button></div></div>`;

  // 4. Income vs minimum
  const months = Array.from({ length: 6 }, (_, i) => shiftMonth(month, i - 6));
  const incomes = months.map((m) => sumBy(flows().filter((t) => t.date.startsWith(m)), "income"));
  const withData = incomes.filter((v) => v > 0);
  let incomeHtml;
  if (withData.length < 2) incomeHtml = `<p class="muted small">Вноси доходы с указанием проекта. Через пару месяцев здесь появятся средний и минимальный доход и сравнение с обязательными расходами.</p>`;
  else {
    const avg = withData.reduce((a, v) => a + v, 0) / withData.length, min = Math.min(...withData);
    const diff = avg - minimum;
    incomeHtml = `<div class="kv small">
      <div><span class="muted">Средний доход (${withData.length} ${plural(withData.length, "месяц", "месяца", "месяцев")})</span><span>${esc(money(Math.round(avg)))}</span></div>
      <div><span class="muted">Худший месяц</span><span>${esc(money(min))}</span></div>
      <div><span class="muted">Нужно в месяц (обязательные${p.living ? " + жизнь" : ""})</span><span>${esc(money(minimum))}</span></div></div>
      <div class="verdict ${diff >= 0 ? "good" : "bad"}" style="margin-top:10px">${diff >= 0
        ? `В среднем после обязательных расходов остаётся ${esc(money(Math.round(diff)))} в месяц на конверты.`
        : `В среднем доход ниже нужного на ${esc(money(Math.round(-diff)))} в месяц. Разницу сейчас покрывают накопления.`}</div>`;
  }
  html += `<div class="card"><h3>Доход и минимум на месяц</h3>${incomeHtml}</div>`;

  // 5. Parameters
  html += `<div class="card"><h3>Параметры плана</h3><div class="params">
    <label>На жизнь в месяц (еда, транспорт, бытовое)<input id="pLiving" inputmode="decimal" value="${p.living || ""}" placeholder="Например, 250 000"></label>
    <label>Буфер свободных денег, месяцев<input id="pBuffer" inputmode="decimal" value="${p.bufferMonths}"></label>
    <label>Свободных денег было на старте<input id="pOpening" inputmode="decimal" value="${p.openingFree || ""}" placeholder="0"></label></div>
    <p class="muted small" style="margin-top:10px">Когда приходит доход, свободные деньги сначала добираются до буфера: неоплаченные платежи этого месяца плюс ${nf.format(p.bufferMonths)} × (обязательные${p.living ? " + жизнь" : ""}). Всё, что сверху, раскладывается по конвертам в процентах.</p></div>`;
  el.innerHTML = html;
}

function renderOps() {
  const sel = $("#fCat");
  if (canRender(sel.parentElement, "filters")) {
    const cats = app.profile.categories.filter((c) => ui.fKind === "all" || c.kind === ui.fKind);
    if (!cats.some((c) => c.id === ui.fCat)) ui.fCat = "";
    sel.innerHTML = `<option value="">Все категории</option>` + cats.map((c) =>
      `<option value="${esc(c.id)}">${esc(c.name)}${ui.fKind === "all" ? (c.kind === "income" ? " (доход)" : " (расход)") : ""}</option>`).join("");
    sel.value = ui.fCat;
    document.querySelectorAll("#fKind button").forEach((b) => b.classList.toggle("active", b.dataset.kind === ui.fKind));
  }
  const box = $("#txList");
  if (!app.ready) { box.innerHTML = `<p class="empty">Загружаю твои операции…</p>`; return; }
  if (app.txs.length === 0) {
    box.innerHTML = `<div class="welcome">
      <h2>Здесь появятся твои доходы и расходы</h2>
      <p>Добавь первую операцию, и сразу увидишь баланс, статистику по категориям и остаток по бюджетам. Можно сначала посмотреть, как всё выглядит, на примерных данных.</p>
      <div class="btn-row"><button class="btn primary" data-action="new-tx">Добавить операцию</button>
      <button class="btn" data-action="load-sample">Показать на примере</button></div></div>`;
    return;
  }
  const cats = catMap();
  const q = ui.query.trim().toLowerCase();
  const periodList = app.txs.filter(inPeriod);
  const label = (t) => t.kind === "transfer" ? `${envName(t.from)} → ${envName(t.to)}` : cats.get(t.categoryId)?.name || "Без категории";
  const list = periodList
    .filter((t) => ui.fKind === "all" || t.kind === ui.fKind)
    .filter((t) => !ui.fCat || t.categoryId === ui.fCat)
    .filter((t) => !q || [t.note, t.project || "", label(t)].some((s) => s.toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const groups = new Map();
  for (const t of list) (groups.get(t.date) || groups.set(t.date, []).get(t.date)).push(t);
  const samples = app.txs.some((t) => t.sample);
  let html = samples ? `<div class="banner"><span>Сейчас показаны примерные данные.</span><button class="link-btn" data-action="clear-sample">Удалить примеры</button></div>` : "";
  if (!groups.size) html += `<p class="empty">${periodList.length ? "Ничего не найдено." : "За этот период операций нет. Нажми «+», чтобы добавить."}</p>`;
  for (const [date, items] of groups) {
    const daySum = items.reduce((a, t) => a + (t.kind === "income" ? t.amount : t.kind === "expense" ? -t.amount : 0), 0);
    html += `<div class="day"><div class="day-head"><span>${esc(dayLabel(date))}</span><span class="${daySum < 0 ? "neg" : daySum > 0 ? "pos" : "muted"}">${esc(signed(daySum))}</span></div><ul class="tx-list">`;
    for (const t of items) {
      if (t.kind === "transfer") {
        html += `<li><button class="tx" data-action="edit-move" data-id="${esc(t.id)}"><span class="dot" style="background:var(--muted)"></span>
          <span class="tx-main"><span class="tx-cat">${esc(label(t))}</span><span class="tx-note">${esc(t.note || "Перевод между конвертами")}</span></span>
          <span class="tx-amount move">${esc(money(t.amount))}</span></button></li>`;
        continue;
      }
      const c = cats.get(t.categoryId);
      const sub = [t.project, t.envelopeId ? `из «${envName(t.envelopeId)}»` : "", t.note].filter(Boolean).join(" · ");
      html += `<li><button class="tx" data-action="edit-tx" data-id="${esc(t.id)}">
        <span class="dot" style="background:${esc(c ? c.color : "#94a3b8")}"></span>
        <span class="tx-main"><span class="tx-cat">${esc(label(t))}${t.sample ? `<span class="tag">пример</span>` : ""}${t.billId ? `<span class="tag">обязательный</span>` : ""}</span>
        ${sub ? `<span class="tx-note">${esc(sub)}</span>` : ""}</span>
        <span class="tx-amount ${t.kind === "income" ? "pos" : ""}">${t.kind === "income" ? "+" : "−"}${esc(money(t.amount))}</span></button></li>`;
    }
    html += `</ul></div>`;
  }
  box.innerHTML = html;
}

function renderStats() {
  const el = $("#view-stats");
  const cats = catMap();
  const totals = new Map();
  for (const t of flows()) if (inPeriod(t) && t.kind === ui.statsKind) totals.set(t.categoryId, (totals.get(t.categoryId) || 0) + t.amount);
  const slices = [...totals].map(([id, value]) => ({ c: cats.get(id) || { id, name: "Без категории", color: "#94a3b8" }, value })).sort((a, b) => b.value - a.value);
  const total = slices.reduce((a, s) => a + s.value, 0);

  const r = 60, C = 2 * Math.PI * r;
  let off = 0, arcs = "";
  for (const s of slices) {
    const len = (s.value / total) * C;
    arcs += `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${esc(s.c.color)}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;
    off += len;
  }
  const kindWord = ui.statsKind === "expense" ? "расходов" : "доходов";
  const donut = total === 0 ? `<p class="empty">Нет ${kindWord} за выбранный период.</p>` : `
    <div class="donut-wrap"><div class="donut">
      <svg viewBox="0 0 160 160" role="img" aria-label="Доли ${kindWord} по категориям"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--track)" stroke-width="22"/>${arcs}</svg>
      <div class="donut-center"><span class="muted small">Итого</span><strong>${esc(money(total))}</strong></div></div>
      <ul class="legend">${slices.map((s) => `<li><span class="dot" style="background:${esc(s.c.color)}"></span><span class="legend-name">${esc(s.c.name)}</span>
        <span class="legend-value">${esc(money(s.value))}</span><span class="muted legend-pct">${Math.round((s.value / total) * 100)}%</span></li>`).join("")}</ul></div>`;

  const last = ui.period === "all" ? currentMonth() : ui.period;
  const months = Array.from({ length: 6 }, (_, i) => {
    const m = shiftMonth(last, i - 5);
    const list = flows().filter((t) => t.date.startsWith(m));
    return { m, inc: sumBy(list, "income"), exp: sumBy(list, "expense") };
  });
  const max = Math.max(1, ...months.flatMap((x) => [x.inc, x.exp]));
  const bars = months.map((x) => {
    const net = x.inc - x.exp;
    return `<div class="bar-col" title="${esc(`Доходы: ${money(x.inc)}\nРасходы: ${money(x.exp)}`)}">
      <div class="bar-pair"><div class="bar inc" style="height:${(x.inc / max) * 100}%"></div><div class="bar exp" style="height:${(x.exp / max) * 100}%"></div></div>
      <span class="bar-label">${MONTHS_SHORT[Number(x.m.slice(5, 7)) - 1]}</span>
      <span class="bar-net ${net < 0 ? "neg" : net > 0 ? "pos" : "muted"}">${net > 0 ? "+" : ""}${esc(cf.format(net))}</span></div>`;
  }).join("");

  // Projects over the last 6 months: who pays, how much, and who went quiet.
  const from = shiftMonth(currentMonth(), -5) + "-01", today = todayISO();
  const projects = new Map();
  for (const t of flows()) {
    if (t.kind !== "income" || t.date < from || t.recon) continue;
    const key = t.project || "Без проекта";
    const p = projects.get(key) || { sum: 0, count: 0, last: "" };
    p.sum += t.amount; p.count++; if (t.date > p.last) p.last = t.date;
    projects.set(key, p);
  }
  const projRows = [...projects].sort((a, b) => b[1].sum - a[1].sum).map(([name, p]) => {
    const idle = daysBetween(p.last, today);
    return `<li class="proj"><span class="proj-name">${esc(name)}${idle > 45 ? `<span class="tag" style="color:var(--warn)">нет оплат ${idle} ${plural(idle, "день", "дня", "дней")}</span>` : ""}</span>
      <span class="proj-sum">${esc(money(p.sum))}</span>
      <span class="muted small">${p.count} ${plural(p.count, "оплата", "оплаты", "оплат")} · последняя ${esc(shortDate(p.last))}</span><span></span></li>`;
  }).join("");

  el.innerHTML = `
    <div class="card"><div class="card-head"><h3>По категориям</h3>
      <div class="segmented"><button data-action="stats-kind" data-kind="expense" class="${ui.statsKind === "expense" ? "active" : ""}">Расходы</button>
      <button data-action="stats-kind" data-kind="income" class="${ui.statsKind === "income" ? "active" : ""}">Доходы</button></div></div>${donut}</div>
    <div class="card"><div class="card-head"><h3>Последние 6 месяцев</h3>
      <div class="chart-legend small"><span><i class="swatch inc"></i>Доходы</span><span><i class="swatch exp"></i>Расходы</span></div></div>
      <div class="bars">${bars}</div></div>
    <div class="card"><div class="card-head"><h3>Доход по проектам</h3><span class="muted small">за 6 месяцев</span></div>
      ${projRows ? `<ul class="proj-list">${projRows}</ul>` : `<p class="muted small">Указывай проект при добавлении дохода. Здесь будет видно, кто сколько приносит и какой проект давно не платил.</p>`}</div>`;
}

function progress(value, limit) {
  const ratio = value / limit;
  const level = ratio > 1 ? "over" : ratio >= 0.8 ? "warn" : "ok";
  return `<div class="progress" role="progressbar" aria-valuenow="${Math.round(ratio * 100)}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill ${level}" style="width:${Math.min(ratio, 1) * 100}%"></div></div>`;
}
function renderBudgets() {
  const el = $("#view-budgets");
  if (!canRender(el, "budgets")) return;
  const month = ui.period === "all" ? currentMonth() : ui.period;
  const spent = new Map();
  for (const t of app.txs) if (t.kind === "expense" && t.date.startsWith(month)) spent.set(t.categoryId, (spent.get(t.categoryId) || 0) + t.amount);
  const cats = app.profile.categories.filter((c) => c.kind === "expense");
  const b = app.profile.budgets;
  const withB = cats.filter((c) => b[c.id]);
  const tl = withB.reduce((a, c) => a + b[c.id], 0), ts = withB.reduce((a, c) => a + (spent.get(c.id) || 0), 0);
  let html = `<p class="muted small hint">Месячные лимиты на категории расходов. Месяц: <b>${esc(monthLabel(month))}</b>. Чтобы убрать лимит, очисти поле.</p>`;
  if (withB.length) html += `<div class="card"><div class="budget-head"><strong>Все лимиты</strong><span>${esc(money(ts))} из ${esc(money(tl))}</span></div>${progress(ts, tl)}</div>`;
  html += `<ul class="budget-list">` + cats.map((c) => {
    const lim = b[c.id], s = spent.get(c.id) || 0, left = lim ? lim - s : 0;

/** Reconciliation: one real balance replaces logging every small purchase; the gap becomes one "everyday spending" record. */
function ensureCategory(name, kind) {
  const found = app.profile.categories.find((c) => c.name === name && c.kind === kind);
  if (found) return found.id;
  const c = { id: uid(), name, kind, color: PALETTE[app.profile.categories.length % PALETTE.length] };
  app.profile.categories.push(c);
  app.profileSaved = false;
  return c.id;
}
function openRecon() {
  const bal = envBalances(), free = freeMoney();
  const sameCard = app.profile.envelopes.filter((e) => e.liquid && bal.get(e.id) > 0);
  const sameSum = sameCard.reduce((a, e) => a + bal.get(e.id), 0);
  openForm({
    title: "Сверка баланса",
    body: `<p class="form-intro">Посмотри в Kaspi и впиши, сколько у тебя сейчас свободных денег: на картах и наличными.
        По записям приложения должно быть ${esc(money(free))}.</p>
      <label>Свободных денег по факту, ${esc(app.profile.currency)}<input id="g-actual" inputmode="decimal" placeholder="Например, 84 500"></label>
      ${sameSum > 0 ? `<p class="small muted">Если отложенное в конверты (${esc(sameCard.map((e) => e.name).join(", "))}: ${esc(money(sameSum))}) лежит на той же карте, вычти эту сумму. Отбасы и депозиты не считай.</p>` : `<p class="small muted">Отбасы и депозиты не считай: это деньги конвертов.</p>`}
      <p class="small" id="g-diff"></p>`,
    submit: "Сверить",
    onInput() {
      const v = parseAmount(gVal("actual")), el = $("#g-diff");
      if (!(v >= 0)) { el.textContent = ""; return; }
      const d = free - v;
      el.className = "small " + (d > 0 ? "warn" : d < 0 ? "pos" : "muted");
      el.textContent = d > 0 ? `Запишется расход ${money(d)}: повседневные траты с ${app.profile.lastRecon ? "прошлой сверки" : "начала учёта"}.`
        : d < 0 ? `Запишется неучтённое поступление ${money(-d)}.` : "Всё сходится, ничего записывать не нужно.";
    },
    onSubmit() {
      const v = parseAmount(gVal("actual"));
      if (!(v >= 0)) return "Впиши сумму числом, например 84 500.";
      const d = Math.round((free - v) * 100) / 100, today = todayISO();
      const since = app.profile.lastRecon ? `с ${shortDate(app.profile.lastRecon)}` : "с начала учёта";
      let tx = null;
      if (d !== 0) {
        const kind = d > 0 ? "expense" : "income";
        const categoryId = ensureCategory(kind === "expense" ? "Повседневные расходы" : "Другое", kind);
        tx = { id: uid(), kind, amount: Math.abs(d), categoryId, date: today, createdAt: Date.now(), recon: true,
          note: kind === "expense" ? `Сверка баланса: траты ${since}` : `Сверка баланса: неучтённые поступления ${since}` };
      }
      updateProfile((p) => (p.lastRecon = today));
      if (tx) upsertTx(tx);
      toast(d === 0 ? "Баланс сходится." : d > 0 ? `Записаны повседневные траты: ${money(d)}.` : `Записано поступление: ${money(-d)}.`);
    },
  });
}

function parseQuick(input) {

  const kind = income ? "income" : "expense";

  let categoryId = "";
  // 1) your own history: the latest record whose comment shares a word
  const past = app.txs.filter((t) => t.kind === kind && !t.recon && t.note && cats.some((c) => c.id === t.categoryId)).sort((a, b) => b.date.localeCompare(a.date));
  for (const t of past) if (words(t.note).some((w) => ws.includes(w))) { categoryId = t.categoryId; break; }
  // 2) category names, then common words
  if (!categoryId) {
    const byName = cats.find((c) => words(c.name).some((w) => ws.some((x) => x.startsWith(w.slice(0, 5)))));
    const kw = kind === "expense" ? KEYWORDS.find(([, list]) => list.split(" ").some((k) => ws.some((x) => x.startsWith(k)))) : null;
    categoryId = byName?.id || (kw && cats.find((c) => c.name === kw[0])?.id) || "";
  }
  if (!categoryId) categoryId = (cats.find((c) => c.name === (kind === "income" ? "Проекты" : "Другое")) || cats[0])?.id || "";
  return { kind, amount, categoryId, rest };
}
function describeQuick(q) {
  const c = app.profile.categories.find((x) => x.id === q.categoryId);
  return `${q.kind === "income" ? "Доход" : "Расход"} · ${c ? c.name : "без категории"} · ${money(q.amount)}${q.rest ? ` · ${q.rest}` : ""}`;
}
const QUICK_HINT = "Сумма и пара слов. Знак «+» в начале — это доход.";
$("#quickInput").addEventListener("input", (e) => {
  const v = e.target.value.trim(), q = v ? parseQuick(v) : null;
  $("#quickHint").textContent = !v ? QUICK_HINT : q ? `Запишется: ${describeQuick(q)}` : "Не вижу сумму. Пример: такси 2500";
});
$("#quick").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("#quickInput"), q = parseQuick(input.value);
  if (!q) return toast("Не вижу сумму. Пример: такси 2500 или +300000 Проект А");
  if (!q.categoryId) return toast("Нет подходящей категории. Добавь её во вкладке «Ещё».");
  const tx = { id: uid(), kind: q.kind, amount: q.amount, categoryId: q.categoryId, date: todayISO(), note: q.kind === "income" ? "" : q.rest, createdAt: Date.now() };
  if (q.kind === "income" && q.rest) tx.project = q.rest;
  input.value = ""; $("#quickHint").textContent = QUICK_HINT; input.blur();
  upsertTx(tx);
  if (tx.kind === "income" && app.profile.envelopes.length) openAllocation(tx);
  else toast(`Записано: ${describeQuick(q)}`, "Отменить", () => removeTxs([tx.id]));
});

function setMarked(billId, on) {
  const month = currentMonth();
  updateProfile((p) => {
    const list = (p.marked[month] || []).filter((x) => x !== billId);
    p.marked[month] = on ? [...list, billId] : list;
  });
}
function payBill(bill) {
  openSheet(null, { kind: "expense", amount: bill.amount, categoryId: bill.categoryId, note: bill.name, billId: bill.id, date: todayISO() });
}

// ---------- dialog & toast ----------
function askConfirm(text, okLabel) {
  return new Promise((resolve) => {
    $("#dialogText").textContent = text;
    $("#dialogOk").textContent = okLabel;
    $("#dialog").hidden = false;
    $("#dialogCancel").focus();
    const done = (v) => { $("#dialog").hidden = true; $("#dialogOk").onclick = $("#dialogCancel").onclick = null; resolve(v); };
    $("#dialogOk").onclick = () => done(true);
    $("#dialogCancel").onclick = () => done(false);
  });
}
let toastTimer;
function toast(msg, actionLabel, action) {
  const t = $("#toast");
  t.textContent = msg;
  if (actionLabel) {
    const btn = document.createElement("button");
    btn.className = "toast-action"; btn.textContent = actionLabel;
    btn.onclick = () => { t.hidden = true; action(); };
    t.append(btn);
  }
  t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), actionLabel ? 7000 : 4000);
}

// ---------- files ----------
function exportData() {
  return { ...app.profile, transactions: app.txs.filter((t) => !t.sample) };
}
async function saveFile(filename, data) {
  let dl = null;
  try { dl = window.claude && (await window.claude.use("downloads")); } catch { dl = null; }
  if (!dl) return toast("Скачивание недоступно в этом окне. Открой страницу в claude.ai.");
  try { await dl.save({ filename, data }); }
  catch (e) { if (!e || e.code !== "declined") toast("Не получилось сохранить файл."); }
}
$("#fileIn").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  let raw;
  try { raw = JSON.parse(await file.text()); } catch { return toast("Не удалось прочитать файл. Нужна резервная копия в формате JSON."); }
  const profile = parseProfile(raw);
  const txs = profile && Array.isArray(raw.transactions) ? raw.transactions.map((t) => parseTx(t)).filter(Boolean) : null;
  if (!profile || !txs) return toast("Этот файл не похож на резервную копию «Моих финансов».");
  if (!(await askConfirm(`Заменить текущие данные копией? В ней операций: ${txs.length}. Текущие операции будут удалены.`, "Заменить"))) return;
  replaceAll(profile, txs);
  toast(`Восстановлено операций: ${txs.length}.`);
});

// ---------- sample data ----------
function loadSample() {
  const byName = (name, kind) => app.profile.categories.find((c) => c.name === name && c.kind === kind) || app.profile.categories.find((c) => c.kind === kind);
  const now = new Date(), today = now.getDate();
  const rows = [];
  const add = (monthsAgo, day, kind, cat, amount, note, project) => {
    const d = new Date(now.getFullYear(), now.getMonth() - monthsAgo, Math.min(day, monthsAgo === 0 ? today : 28));
    const c = byName(cat, kind);
    if (!c) return;
    const tx = { id: uid(), kind, amount, categoryId: c.id, date: iso(d), note: "Пример: " + note, createdAt: Date.now() + rows.length, sample: true };
    if (project) tx.project = project;
    rows.push(tx);
  };
  for (const m of [2, 1, 0]) {
    add(m, 4, "income", "Проекты", 380000 + m * 40000, "аванс", "Проект А");
    if (m !== 1) add(m, 19, "income", "Проекты", 250000, "оплата этапа", "Проект Б");
    add(m, 9, "expense", "Продукты", 18450 + m * 2300, "закупка на неделю");
    add(m, 12, "expense", "Кафе и рестораны", 6800 - m * 900, "ужин с друзьями");
    add(m, 14, "expense", "Транспорт", 4200, "такси");
    add(m, 16, "expense", "Продукты", 21300 - m * 1500, "закупка на неделю");
  }
  upsertTxs(rows);
}

// ---------- events ----------
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-action]");
  if (!b || b.disabled) return;
  const a = b.dataset.action, id = b.dataset.id;
  const env = () => app.profile.envelopes.find((x) => x.id === id);
  if (a === "tab") { ui.tab = b.dataset.tab; renderAll(); }
  else if (a === "month") { ui.period = shiftMonth(ui.period, Number(b.dataset.delta)); renderAll(); }
  else if (a === "toggle-all") { ui.period = ui.period === "all" ? currentMonth() : "all"; renderAll(); }
  else if (a === "fkind") { ui.fKind = b.dataset.kind; ui.fCat = ""; renderOps(); }
  else if (a === "stats-kind") { ui.statsKind = b.dataset.kind; renderStats(); }
  else if (a === "new-tx") openSheet(null);
  else if (a === "edit-tx") { const tx = app.txs.find((t) => t.id === id); if (tx) openSheet(tx); }
  else if (a === "edit-move") {
    const tx = app.txs.find((t) => t.id === id);
    if (tx && (await askConfirm(`Отменить перевод ${money(tx.amount)}: ${envName(tx.from)} → ${envName(tx.to)}?`, "Отменить перевод"))) removeTxs([tx.id]);
  }
  else if (a === "sheet-kind") { ui.sheetKind = b.dataset.kind; syncSheetKind($("#fCategory").value); }
  else if (a === "close-sheet") closeSheet();
  else if (a === "delete-tx") {
    const tx = ui.editing; if (!tx) return;
    const linked = app.txs.filter((t) => t.sourceTxId === tx.id).map((t) => t.id);
    $("#sheet").hidden = true;
    if (await askConfirm(linked.length ? "Удалить эту операцию? Её распределение по конвертам тоже отменится." : "Удалить эту операцию?", "Удалить")) {
      ui.editing = null; removeTxs([tx.id, ...linked]);
    } else $("#sheet").hidden = false;
  }
  else if (a === "mark-bill") {
    const billId = id || ui.sheetBillId;
    if (!id) closeSheet();
    setMarked(billId, true);
    toast("Платёж отмечен оплаченным. Свободные деньги не изменились.", "Отменить", () => setMarked(billId, false));
  }
  else if (a === "unmark-bill") {
    setMarked(id, false);
    toast("Отметка снята.", "Вернуть", () => setMarked(id, true));
  }
  else if (a === "recon") openRecon();
  else if (a === "pay-bill") { const bill = app.profile.bills.find((x) => x.id === id); if (bill) payBill(bill); }
  else if (a === "edit-bill") { const bill = app.profile.bills.find((x) => x.id === id); if (bill) openBillForm(bill); }
  else if (a === "new-bill") openBillForm(null);
  else if (a === "new-env") openEnvForm(null);
  else if (a === "edit-env") { if (env()) openEnvForm(env()); }
  else if (a === "env-in") { if (env()) openMoveForm(env(), "in"); }
  else if (a === "env-out") { if (env()) openMoveForm(env(), "out"); }
  else if (a === "load-sample") loadSample();
  else if (a === "clear-sample") removeTxs(app.txs.filter((t) => t.sample).map((t) => t.id));
  else if (a === "delete-cat") {
    const c = app.profile.categories.find((x) => x.id === id);
    if (c && (await askConfirm(`Удалить категорию «${c.name}»?`, "Удалить"))) {
      updateProfile((p) => { p.categories = p.categories.filter((x) => x.id !== c.id); delete p.budgets[c.id]; });
    }
  }
  else if (a === "export-json") saveFile(`finance-${todayISO()}.json`, JSON.stringify(exportData(), null, 2));
  else if (a === "export-csv") {
    const cats = catMap(), q = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const rows = flows().sort((x, y) => x.date.localeCompare(y.date)).map((t) =>
      [t.date, t.kind === "income" ? "Доход" : "Расход", q(cats.get(t.categoryId)?.name || ""), q(t.project || ""), String(t.amount).replace(".", ","), q(t.note)].join(";"));
    saveFile(`finance-${todayISO()}.csv`, "﻿" + ["Дата;Тип;Категория;Проект;Сумма;Комментарий", ...rows].join("\r\n"));
  }
  else if (a === "import") $("#fileIn").click();
  else if (a === "reset") {
    if (await askConfirm("Удалить все операции, платежи, конверты и бюджеты? Отменить это будет нельзя.", "Удалить всё")) {
      replaceAll(defaultProfile(), []); toast("Все данные удалены.");
    }
  }
});
$("#sheet").addEventListener("mousedown", (e) => { if (e.target === e.currentTarget) closeSheet(); });
$("#formSheet").addEventListener("mousedown", (e) => { if (e.target === e.currentTarget) closeForm(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("#dialog").hidden) $("#dialogCancel").click();
  else if (!$("#formSheet").hidden) closeForm();
  else if (!$("#sheet").hidden) closeSheet();
});
$("#fCat").addEventListener("change", (e) => { ui.fCat = e.target.value; renderOps(); });
$("#fQuery").addEventListener("input", (e) => { ui.query = e.target.value; renderOps(); });

// Settings, budgets and plan parameters: commit text edits when the field loses focus or on Enter.
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches("[data-budget], [data-cat-name], #currency, #pLiving, #pBuffer, #pOpening")) e.target.blur();
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.budget !== undefined) {
    const id = t.dataset.budget, raw = t.value.trim();
    if (!raw) { if (app.profile.budgets[id]) updateProfile((p) => delete p.budgets[id]); return; }
    const v = parseAmount(raw);
    if (!(v > 0)) { t.classList.add("invalid"); toast("Лимит — это число больше нуля, например 50000."); return; }
    if (v !== app.profile.budgets[id]) updateProfile((p) => (p.budgets[id] = v)); else renderAll();
  } else if (t.dataset.catName !== undefined) {
    const c = app.profile.categories.find((x) => x.id === t.dataset.catName), name = t.value.trim();
    if (c && name && name !== c.name) updateProfile(() => (c.name = name)); else if (c) t.value = c.name;
  } else if (t.dataset.catColor !== undefined) {
    const c = app.profile.categories.find((x) => x.id === t.dataset.catColor);
    if (c && t.value !== c.color) updateProfile(() => (c.color = t.value));
  } else if (t.id === "currency") {
    const v = t.value.trim() || "₸";
    if (v !== app.profile.currency) updateProfile((p) => (p.currency = v)); else t.value = v;
  } else if (t.id === "pLiving" || t.id === "pBuffer" || t.id === "pOpening") {
    const key = { pLiving: "living", pBuffer: "bufferMonths", pOpening: "openingFree" }[t.id];
    const v = t.value.trim() ? parseAmount(t.value) : key === "bufferMonths" ? 1 : 0;
    if (!(v >= 0) || (key === "bufferMonths" && v > 12)) { toast(key === "bufferMonths" ? "Буфер — от 0 до 12 месяцев." : "Введи сумму числом, например 250 000."); return; }
    if (v !== app.profile[key]) updateProfile((p) => (p[key] = v)); else renderAll();
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "addCat") return;
  e.preventDefault();
  const name = $("#newCatName").value.trim();
  if (!name) return toast("Введи название категории.");
  const kind = $("#newCatKind").value;
  $("#newCatName").value = "";
  updateProfile((p) => p.categories.push({ id: uid(), name, kind, color: PALETTE[p.categories.length % PALETTE.length] }));
  toast(`Категория «${name}» добавлена.`);
});

init();
</script>
